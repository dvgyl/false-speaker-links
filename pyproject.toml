[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stage-audit"
version = "0.1.0"
description = "Compare saved retrieval records, context changes, and answer gains and losses offline."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dev D. Goyal" }]
keywords = ["LLM memory", "agent memory", "entity resolution", "knowledge graph", "retrieval-augmented generation", "evaluation"]

[project.scripts]
stage-audit = "stage_audit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
